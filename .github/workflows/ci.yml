name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        env:
          JWT_SECRET: ci-test-secret-key-not-for-production-32
          CORS_ORIGINS: http://localhost:3000
          DATABASE_URL: sqlite+aiosqlite://
          GOOGLE_CLIENT_ID: test-client.apps.googleusercontent.com
          STRIPE_WEBHOOK_SECRET: whsec_test
          ENVIRONMENT: test
        run: pytest tests -v --tb=short -m "not integration"

  backend-mysql:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: realestate_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptestpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run MySQL integration tests
        env:
          JWT_SECRET: ci-test-secret-key-not-for-production-32
          CORS_ORIGINS: http://localhost:3000
          MYSQL_TEST_URL: mysql+aiomysql://root:testpassword@127.0.0.1:3307/realestate_test
          GOOGLE_CLIENT_ID: test-client.apps.googleusercontent.com
          STRIPE_WEBHOOK_SECRET: whsec_test
          ENVIRONMENT: test
          RUN_MYSQL_TESTS: "1"
        run: pytest tests/integration -v --tb=short

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Build
        env:
          REACT_APP_BACKEND_URL: http://localhost:8001
          CI: "false"
        run: npm run build
